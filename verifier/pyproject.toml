[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "nemotron-verifier"
version = "0.1.0"
description = "Independent Nemotron NVFP4 evaluation on RTX A5000 inference deployments."
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "httpx>=0.28,<1", "uvicorn>=0.34,<1"]

[project.optional-dependencies]
evaluation = ["datasets>=4,<5", "transformers>=4.57,<6"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
