[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "agent-harness"
version = "0.1.0"
description = "Sandboxed researcher and benchmark attempt agents."
requires-python = ">=3.10"
dependencies = [
  "cryptography>=44,<48",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "jsonschema[format]>=4.23,<5",
  "mcp>=1.30,<2",
  "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
